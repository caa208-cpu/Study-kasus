
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Profil Sekolah</title>
    <style>
        body {
            font-family: Arial;
            padding: 30px;
            background: white;
            color: black;
        }

        body.gelap {
            background: #1e1e1e;
            color: #f5f5f5;
        }

        .info {
            background: #e0f0ff;
            color: #222;
            padding: 15px;
            margin-top: 20px;
            border-radius: 8px;
        }

        body.gelap .info {
            background: #333333;
            color: white;
        }
    </style>
</head>
<body>

    <h1>SMK Telkom Malang</h1>
    <p>Jurusan Rekayasa Perangkat Lunak.</p>

    <button id="btnTema">Mode Gelap</button>

    <div class="info">
        <h3>Hai Everyone!!!</h3>
        <p>Let me introduce my self, my name is Ravasya Aditya Mecha u can call me vasya >_< . I'm a student of SMK Telkom Malang.</p>
    </div>

    <script>
        const btnTema = document.getElementById('btnTema');

        btnTema.addEventListener('click', () => {
            document.body.classList.toggle('gelap');

            if (document.body.classList.contains('gelap')) {
                btnTema.textContent = 'Mode Terang';
            } else {
                btnTema.textContent = 'Mode Gelap';
            }
        });
    </script>

</body>
</html>
